name: Original Solar Water Farm 3D native acceptance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'tests/browser_native_original.py'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/native-original-browser.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-native-browser:
    name: original-native-${{ matrix.viewport }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test harness
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Run original Solar Water Farm 3D acceptance
        env:
          HOMESTEAD_BROWSER_VIEWPORT: ${{ matrix.viewport }}
        run: python tests/browser_native_original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-native-3d-${{ matrix.viewport }}
          path: tests/artifacts/native-original-${{ matrix.viewport }}.png
