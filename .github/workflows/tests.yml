name: Homestead integrated model tests
on:
  push:
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check vendor/solar-next-core.js
          node --check vendor/water-engine.js
          node --check vendor/farm-core.js
          node --check src/coordinator.js
      - name: Deterministic cross-model contract tests
        run: node --test tests/engine.test.cjs
