name: Homestead integrated model tests
on:
  push:
    branches: [main] # prevent duplicate feature-branch push and PR workflows
  pull_request:
concurrency:
  # The newest exact-head PR commit supersedes earlier verification attempts.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check all local simulation JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src/*.js src/*.mjs vendor/*.js)
          if (( ${#files[@]} == 0 )); then
            echo 'No JavaScript sources found' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
      - name: Discover and run all model and contract tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.cjs tests/*.test.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo 'No model test files found' >&2
            exit 1
          fi
          printf 'Running %s test file(s):\n' "${#tests[@]}"
          printf '%s\n' "${tests[@]}"
          node --test "${tests[@]}"
