name: 3D browser smoke
on:
  push:
    branches: [main] # prevent duplicate feature-branch push and PR workflows
  pull_request:
concurrency:
  # The newest exact-head PR commit supersedes earlier verification attempts.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: browser-${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser harness
        run: |
          pip install playwright
          # Avoid apt dependency installation on hosted runners: its external
          # Ubuntu mirror DNS outage prevented application tests from running.
          # Chromium downloads independently; browser launch validates libraries.
          python -m playwright install chromium
      - name: Run integrated WebGL, UI and numerical control smoke
        env:
          HOMESTEAD_BROWSER_VIEWPORT: ${{ matrix.viewport }}
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-smoke-screenshots-${{ matrix.viewport }}
          path: tests/artifacts/*.png
